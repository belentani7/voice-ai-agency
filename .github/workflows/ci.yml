name: Python and Classroom Studio CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q .
      - name: Classroom behavioral and security tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax
        run: node --check classroom/app.js
      - name: Deploy entrypoint smoke test
        run: |
          python -m pip install -r requirements.txt
          python -c "from main import app; assert app.title == 'Voice AI Agency'"
